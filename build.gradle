import me.modmuss50.mpp.platforms.curseforge.Curseforge
import me.modmuss50.mpp.platforms.modrinth.Modrinth
import org.gradle.api.attributes.Usage

plugins {
    id 'java'
    id 'com.gradleup.shadow'
    id 'me.modmuss50.mod-publish-plugin'
}

def MT_TOKEN = System.getenv("MODRINTH_TOKEN")
def CF_TOKEN = System.getenv("CURSEFORGE_TOKEN")

base {
    archivesName = id
}

java {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17
}

println("Gradle Java: ${JavaVersion.current()}")
println("Building project: ${properties.libname}")
println("Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}, Encoding: ${System.getProperty "file.encoding"}")

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url "https://repo.spongepowered.org/maven" }
}

configurations {
    include
    include.extendsFrom(implementation)

    // BINARIES COMPILES AGAINST WATERMEDIA'S JAVA-API VARIANT SO IT INHERITS THE PROVIDED LIBS
    // WATERMEDIA EXPOSES VIA compileOnlyApi (tools, log4j, gson, modloaders) WITHOUT REDECLARING THEM
    library {
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
        }
    }
}

sourceSets {
    // SHADOW
    main.compileClasspath += configurations.include
    main.runtimeClasspath += configurations.include
    test.compileClasspath += configurations.include
    test.runtimeClasspath += configurations.include

    // LIBRARY
    main.compileClasspath += configurations.library
    test.compileClasspath += configurations.library
    test.runtimeClasspath += configurations.library
}

dependencies {
    // WATERMEDIA IS THE PROVIDER: IT EXPOSES tools, log4j, gson AND modloaders TRANSITIVELY
    // (SEE ITS compileOnlyApi), SO BINARIES COMPILES AGAINST WATERMEDIA ALONE
    library "org.watermedia:watermedia"

    // SHADED (AND RELOCATED) INTO THE BINARIES JAR: XZ DECOMPRESSES THE SHIPPED NATIVE ZIPS
    include "org.tukaani:xz:$xz_version"
}

// PROCESS TARGET RESOURCES WITH MOD INFO
processResources {
    outputs.upToDateWhen { false }
    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'pack.mcmeta', 'fabric.mod.json']) {
        expand(project.properties)
    }
}

// SHADOWJAR IS THE PUBLISHED ARTIFACT (RELOCATES XZ); THE THIN JAR IS DISABLED SO ONLY IT LANDS IN build/libs
jar {
    enabled = false
}

shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.include]

    // RELOCATE XZ SO IT DOES NOT COLLIDE WITH OTHER MODS THAT BUNDLE org.tukaani.xz UNRELOCATED
    relocate 'org.tukaani.xz', 'org.watermedia.libs.xz'

    duplicatesStrategy = DuplicatesStrategy.WARN
    manifest {
        attributes "id"                         : id
        attributes "version"                    : version
        attributes "Specification-Title"        : id
        attributes "Specification-Vendor"       : authors
        attributes "Specification-Version"      : version
        attributes "Implementation-Title"       : id
        attributes "Implementation-Version"     : version
        attributes "Implementation-Vendor"      : authors
        attributes "Implementation-Timestamp"   : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        attributes "Main-Class": mainclass
    }
    // XZ IS A MULTI-RELEASE JAR AND SHADOW COPIES ITS `Multi-Release: true` ONTO OUR MANIFEST (IT SCANS
    // THE SHADED DEPS ON EXECUTION, SO THE ATTRIBUTE CANNOT BE UNSET FROM THE manifest {} BLOCK ABOVE).
    // DROPPING META-INF/versions WHOLESALE LEFT THE FLAG WITHOUT ITS PAYLOAD AND FML (FORGE/NEOFORGE)
    // BLEW UP LOOKING FOR IT, SO KEEP THE VERSIONED CLASSES — SHADOW RELOCATES THEM TOO — AND DROP ONLY
    // THE module-info, WHICH WOULD OTHERWISE DECLARE A STALE `org.tukaani.xz` MODULE INSIDE OUR JAR.
    exclude 'META-INF/versions/*/module-info.class', 'META-INF/maven/**'
    // COMBINE DUPLICATE SERVICE FILES INSTEAD OF OVERWRITING THEM
    mergeServiceFiles()
}

assemble.dependsOn shadowJar

// PUBLISH METADATA PARSED FROM gradle.properties
def mcVers = minecraftversions.split(',').collect { it.trim() }
def javaVers = javaversions.split(',').collect { JavaVersion.toVersion(it.trim()) }
def loaders = modloaders.split(',').collect { it.trim() }
// INSIDE publishMods THE DELEGATE IS THE EXTENSION, SO A BARE `version` HITS ITS Property<String> AND
// STRINGIFIES TO "extension 'publishMods' property 'version'"; READ THE PROJECT VERSION OUT HERE INSTEAD
def publishVersion = project.version.toString()

// PLATFORMS ARE CONFIGURED THROUGH THE TYPED Action OVERLOAD AND AN EXPLICIT RECEIVER: THE PLUGIN ALSO
// EXPOSES KOTLIN Closure OVERLOADS THAT THE GROOVY IDE INSPECTION CANNOT RESOLVE, WHICH FLAGS THE WHOLE
// BLOCK AND LEAVES IT WITHOUT A DELEGATE (NO COMPLETION); IT ALSO KILLS THE SHADOWING ABOVE FOR GOOD
publishMods {
    file = shadowJar.archiveFile
    changelog = getChangelogText()
    type = ["alpha": ALPHA, "beta": BETA, "release": STABLE].getOrDefault(project.versiontype.toString().toLowerCase(), ALPHA)
    displayName = publishVersion
    modLoaders.addAll(loaders)
    maxRetries = 2

    dryRun = false

    curseforge({ Curseforge cf ->
        cf.accessToken = CF_TOKEN
        cf.projectId = curseforgeid
        cf.minecraftVersions.addAll(mcVers)
        cf.javaVersions.addAll(javaVers)
        cf.clientRequired = true
        cf.serverRequired = false
        cf.projectSlug = slug // THE MOD ID USES AN UNDERSCORE; THE REAL CURSEFORGE SLUG IS HYPHENATED
        cf.requires("watermedia")
        // THE CURSEFORGE UPLOAD API HAS NO ENDPOINT TO EDIT THE PROJECT PAGE DESCRIPTION; SYNC IS MODRINTH-ONLY
    } as Action<Curseforge>)

    modrinth({ Modrinth mr ->
        mr.accessToken = MT_TOKEN
        mr.projectId = modrinthid
        mr.minecraftVersions.addAll(mcVers)
        mr.requires("watermedia")
        mr.projectDescription = providers.fileContents(layout.projectDirectory.file("README.md")).asText
    } as Action<Modrinth>)
}

def getChangelogText() {
    return file('CHANGELOG.md').readLines('UTF-8').takeWhile { !it.isEmpty() }.join('\n')
}
