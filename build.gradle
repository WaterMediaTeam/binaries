import org.gradle.api.attributes.Usage

plugins {
    id 'java'
    id 'com.gradleup.shadow'
    id 'me.modmuss50.mod-publish-plugin'
}

Usage javaApi = objects.named(Usage, Usage.JAVA_API)
configurations {
    library {
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, javaApi)
        }
    }
}

def providerClasses = files(layout.projectDirectory.dir('../build/classes/java/main')).builtBy(gradle.includedBuild('watermedia').task(':compileJava'))
def hostClasspath = files(configurations.named('library'), providerClasses)
sourceSets {
    // WATERMEDIA COMPILES THE SHARED SOURCES ONCE; THIS MODULE PACKAGES ITS OWN CLASSES.
    main.java.srcDirs = []
    tools.java.srcDirs = ['tools']

    // TESTS NEED THE PROVIDER'S HOST LIBRARIES AND ITS SHARED BINARY CLASSES.
    test.compileClasspath += hostClasspath
    test.runtimeClasspath += hostClasspath
}

def providerProperties = new Properties()
file('../gradle.properties').withInputStream(providerProperties.&load)
dependencies {
    toolsCompileOnly "org.bytedeco:ffmpeg:${providerProperties.ffmpeg_version}"
    library 'org.watermedia:watermedia'
    implementation "org.tukaani:xz:$xz_version"
}

test {
    inputs.files('tools/RepackFFmpeg.java', 'gradle.properties')
}

processResources {
    from('tools/ffmpeg-manifest.properties') {
        into 'META-INF'
    }
}

// ONLY THE SHADED JAR IS DISTRIBUTED.
jar {
    enabled = false
}
shadowJar {
    from(providerClasses) { include 'org/watermedia/binaries/**' }
    archiveClassifier = ''
    relocate 'org.tukaani.xz', 'org.watermedia.libs.xz'
    duplicatesStrategy = DuplicatesStrategy.WARN
    // KEEP XZ'S MULTI-RELEASE CLASSES AND MERGE ITS SERVICES.
    exclude 'META-INF/maven/**'
    mergeServiceFiles()
}

check.dependsOn tasks.named('compileToolsJava')

publishMods {
    file = shadowJar.archiveFile
    curseforge {
        serverRequired = false
        projectSlug = slug
        requires('watermedia')
    }
    modrinth {
        requires('watermedia')
    }
}

apply from: '../gradle/common.gradle'
