pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    // PLUGIN VERSIONS LIVE IN gradle.properties, NOT INLINE IN build.gradle
    plugins {
        id 'com.gradleup.shadow' version providers.gradleProperty('shadow_version').get()
        id 'me.modmuss50.mod-publish-plugin' version providers.gradleProperty('publish_version').get()
    }
}

rootProject.name = 'binaries'

// WATERMEDIA AND BINARIES ARE CODEPENDENT: BINARIES COMPILES AGAINST WATERMEDIA (NetRequest) AND THE
// PROVIDED LIBS WATERMEDIA EXPOSES (tools, log4j, gson, modloaders), WHILE WATERMEDIA COMPILES THE
// BINARIES SOURCES DIRECTLY (WITHOUT SHIPPING THEM), SO ONLY THIS DIRECTION NEEDS A JAR DEPENDENCY.
// BINARIES MUST LIVE INSIDE A WATERMEDIA CHECKOUT (SUBMODULE LAYOUT); CI REPRODUCES THE SAME LAYOUT
if (!file('../settings.gradle').exists())
    throw new GradleException("watermedia build not found at '..': binaries must be cloned inside a watermedia checkout")

includeBuild('..') {
    dependencySubstitution {
        substitute module("org.watermedia:watermedia") using project(":")
    }
}