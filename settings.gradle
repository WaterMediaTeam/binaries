pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    // PLUGIN VERSIONS LIVE IN gradle.properties, NOT INLINE IN build.gradle
    plugins {
        id 'com.gradleup.shadow' version providers.gradleProperty('shadow_version').get()
        id 'me.modmuss50.mod-publish-plugin' version providers.gradleProperty('publish_version').get()
    }
}

rootProject.name = 'binaries'
