name: FFmpeg Windows ARM64

on:
  workflow_call:
    inputs:
      ffmpeg_version:
        required: true
        type: string
  # STANDALONE TRIGGER SO THE FROM-SOURCE GLUE BUILD CAN BE ITERATED WITHOUT
  # RUNNING THE WHOLE ORCHESTRATOR (THIS IS THE ONLY PLATFORM WHOSE GLUE IS
  # COMPILED INSTEAD OF DOWNLOADED).
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'FFmpeg version to build'
        required: true
        default: '8.0.1'
        type: string

env:
  FFMPEG_VERSION: ${{ inputs.ffmpeg_version }}
  # NO PREBUILT windows-arm64 FFMPEG NATIVES EXIST ON MAVEN CENTRAL, SO THE JNI GLUE
  # IS COMPILED FROM javacpp-presets SOURCE AT THIS TAG. MUST MATCH THE javacpp PART OF
  # org.bytedeco:ffmpeg IN THE MAIN PROJECT build.gradle (8.0.1-1.5.13 -> 1.5.13).
  JAVACPP_PRESETS_VERSION: "1.5.13"

jobs:
  build:
    runs-on: windows-11-arm
    name: Build Windows ARM64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            base-devel
            mingw-w64-clang-aarch64-toolchain
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-pkgconf
            wget
            git
            mingw-w64-clang-aarch64-aom
            mingw-w64-clang-aarch64-dav1d
            mingw-w64-clang-aarch64-libx264
            mingw-w64-clang-aarch64-x265
            mingw-w64-clang-aarch64-libvpx
            mingw-w64-clang-aarch64-libtheora
            mingw-w64-clang-aarch64-libvorbis
            mingw-w64-clang-aarch64-opus
            mingw-w64-clang-aarch64-lame
            mingw-w64-clang-aarch64-speex
            mingw-w64-clang-aarch64-libwebp
            mingw-w64-clang-aarch64-openjpeg2
            mingw-w64-clang-aarch64-libass
            mingw-w64-clang-aarch64-freetype
            mingw-w64-clang-aarch64-fontconfig
            mingw-w64-clang-aarch64-fribidi
            mingw-w64-clang-aarch64-harfbuzz
            mingw-w64-clang-aarch64-gnutls
            mingw-w64-clang-aarch64-gmp
            mingw-w64-clang-aarch64-SDL2
            mingw-w64-clang-aarch64-zimg
            mingw-w64-clang-aarch64-libbluray
            mingw-w64-clang-aarch64-libsoxr
            mingw-w64-clang-aarch64-libssh
            mingw-w64-clang-aarch64-srt
            mingw-w64-clang-aarch64-libxml2
            mingw-w64-clang-aarch64-snappy
            mingw-w64-clang-aarch64-xz
            mingw-w64-clang-aarch64-bzip2
            mingw-w64-clang-aarch64-zlib
            mingw-w64-clang-aarch64-openssl

      - name: Download FFmpeg source
        shell: msys2 {0}
        run: |
          curl -L "https://ffmpeg.org/releases/ffmpeg-${{ env.FFMPEG_VERSION }}.tar.xz" -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          mv ffmpeg-${{ env.FFMPEG_VERSION }} ffmpeg-src

      - name: Save configure help
        shell: msys2 {0}
        run: |
          cd ffmpeg-src
          ./configure --help > ../configure-help-windows-arm64.txt

      - name: Configure FFmpeg
        shell: msys2 {0}
        run: |
          cd ffmpeg-src
          
          ./configure \
            --cc=clang \
            --cxx=clang++ \
            --prefix="${{ github.workspace }}/ffmpeg-build" \
            --enable-gpl \
            --enable-version3 \
            --enable-shared \
            --disable-static \
            --enable-pic \
            --enable-w32threads \
            --disable-doc \
            --disable-htmlpages \
            --disable-manpages \
            --disable-podpages \
            --disable-txtpages \
            --disable-debug \
            --disable-x86asm \
            --enable-libaom \
            --enable-libass \
            --enable-libbluray \
            --enable-libdav1d \
            --enable-libfontconfig \
            --enable-libfreetype \
            --enable-libfribidi \
            --enable-libharfbuzz \
            --enable-libmp3lame \
            --enable-libopenjpeg \
            --enable-libopus \
            --enable-libsnappy \
            --enable-libsoxr \
            --enable-libspeex \
            --enable-libsrt \
            --enable-libssh \
            --enable-libtheora \
            --enable-libvorbis \
            --enable-libvpx \
            --enable-libwebp \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libxml2 \
            --enable-libzimg \
            --enable-openssl \
            --enable-gmp \
            --enable-d3d11va \
            --enable-dxva2

      - name: Build FFmpeg
        shell: msys2 {0}
        run: |
          cd ffmpeg-src
          make -j$(nproc)
          make install

      - name: Test binaries
        shell: msys2 {0}
        run: |
          export PATH="${{ github.workspace }}/ffmpeg-build/bin:$PATH"
          ffmpeg -version
          ffprobe -version

      - name: Set up JDK for JavaCPP
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build JavaCPP JNI glue
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # NO PREBUILT windows-arm64 FFMPEG EXISTS ON MAVEN CENTRAL, SO WE COMPILE THE
          # JNI GLUE OURSELVES AGAINST OUR FRESHLY BUILT FFMPEG. cppbuild.skip REUSES OUR
          # LIBS INSTEAD OF REBUILDING FFMPEG; CLANGARM64 LINKS THE LLVM-MINGW IMPORT LIBS.
          # setup-msys2 INSTALLS UNDER $RUNNER_TEMP, NOT C:\msys64.
          $cab = "$env:RUNNER_TEMP\msys64\clangarm64\bin"
          $env:PATH = "$cab;" + $env:PATH
          # JavaCPP DEFAULTS TO `g++` ON WINDOWS, WHICH RESOLVES TO THE RUNNER'S x86_64
          # MINGW — WRONG ARCH FOR OUR arm64 IMPORT LIBS (ld: "unhandled machine type
          # 0xaa64"). ALIAS g++/gcc TO clangarm64's clang SO THE GLUE LINKS AS arm64.
          Copy-Item "$cab\clang++.exe" "$cab\g++.exe" -Force
          Copy-Item "$cab\clang.exe"   "$cab\gcc.exe" -Force

          git clone --depth 1 --branch "${{ env.JAVACPP_PRESETS_VERSION }}" https://github.com/bytedeco/javacpp-presets.git

          # STAGE OUR FFMPEG WHERE cppbuild WOULD HAVE INSTALLED IT (cppbuild/<platform>/)
          $stage = "javacpp-presets\ffmpeg\cppbuild\windows-arm64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "${{ github.workspace }}\ffmpeg-build\include" -Destination $stage -Recurse -Force
          Copy-Item "${{ github.workspace }}\ffmpeg-build\lib"     -Destination $stage -Recurse -Force
          Copy-Item "${{ github.workspace }}\ffmpeg-build\bin"     -Destination $stage -Recurse -Force

          # BUILD ONLY THE ffmpeg MODULE FROM WITHIN ITS DIR (PARENT POM RESOLVED VIA
          # relativePath). QUOTE EACH ARG — POWERSHELL OTHERWISE MANGLES -Dkey=value.
          cd javacpp-presets/ffmpeg
          mvn -B -ntp install `
            "-Djavacpp.platform=windows-arm64" `
            "-Djavacpp.cppbuild.skip" `
            "-Dmaven.test.skip=true" `
            "-Dmaven.javadoc.skip=true" `
            "-Dmaven.source.skip=true" `
            "-Dplatform.compiler=clang++"

          Write-Host "Built JNI glue:"
          Get-ChildItem -Recurse "target\classes\org\bytedeco\ffmpeg\windows-arm64\jni*.dll"

      - name: Package binaries
        shell: pwsh
        run: |
          $buildDir = "${{ github.workspace }}\ffmpeg-build"
          $packageDir = "$buildDir\package"
          
          New-Item -ItemType Directory -Force -Path $packageDir
          
          # Copy FFmpeg binaries
          Copy-Item "$buildDir\bin\*.dll" -Destination $packageDir -ErrorAction SilentlyContinue
          Copy-Item "$buildDir\bin\*.exe" -Destination $packageDir -ErrorAction SilentlyContinue
          
          # Copy MSYS2 runtime DLLs from CLANGARM64
          $msysDir = "C:\msys64\clangarm64\bin"
          if (Test-Path $msysDir) {
            $runtimeDlls = @(
              "libc++.dll",
              "libunwind.dll", 
              "libwinpthread-1.dll"
            )
            foreach ($dll in $runtimeDlls) {
              $src = Join-Path $msysDir $dll
              if (Test-Path $src) {
                Copy-Item $src -Destination $packageDir
              }
            }
          }
          
          # JavaCPP JNI glue compiled from source (no prebuilt windows-arm64 natives exist)
          Copy-Item "${{ github.workspace }}\javacpp-presets\ffmpeg\target\classes\org\bytedeco\ffmpeg\windows-arm64\jni*.dll" -Destination $packageDir

          # Version file
          Set-Content -Path "$packageDir\version.cfg" -Value "${{ env.FFMPEG_VERSION }}"
          
          # List contents
          Write-Host "Package contents:"
          Get-ChildItem $packageDir
          
          # Create zip
          Compress-Archive -Path "$packageDir\*" -DestinationPath "$buildDir\ffmpeg-windows-arm64.zip"
          Get-ChildItem "$buildDir\ffmpeg-windows-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-arm64
          path: ${{ github.workspace }}/ffmpeg-build/ffmpeg-windows-arm64.zip
          retention-days: 7

      - name: Upload configure help
        uses: actions/upload-artifact@v4
        with:
          name: configure-help-windows-arm64
          path: ${{ github.workspace }}/configure-help-windows-arm64.txt
          retention-days: 7
