name: Build for Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [curseforge, modrinth]
    runs-on: ubuntu-latest

    # WATERMEDIA AND BINARIES ARE CODEPENDENT: REPRODUCE THE SUBMODULE LAYOUT (BINARIES INSIDE
    # WATERMEDIA) SO settings.gradle RESOLVES THE WATERMEDIA BUILD AT '..'
    defaults:
      run:
        working-directory: binaries

    steps:
      - name: Checkout watermedia repository
        uses: actions/checkout@v4
        with:
          repository: WaterMediaTeam/watermedia-v3

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: binaries
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Show Gradle & Java versions
        run: |
          gradle --version
          java -version

      - name: Build JAR
        run: gradle build

      - name: Publish to CurseForge
        if: ${{ matrix.platform == 'curseforge' }}
        run: gradle publishCurseforge --parallel
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

      - name: Publish to Modrinth
        if: ${{ matrix.platform == 'modrinth' }}
        run: gradle publishModrinth --parallel
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}