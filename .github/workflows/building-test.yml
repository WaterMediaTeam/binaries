name: Build Test

on:
  push:
    branches: ["main", "3.0.x"]
  pull_request:
    branches: ["main", "3.0.x"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Read build versions
        id: versions
        shell: pwsh
        run: |
          $gradleVersion = ((Get-Content gradle.properties | Select-String '^gradle_version=').Line -split '=', 2)[1]
          Add-Content $env:GITHUB_OUTPUT "gradle=$gradleVersion"

      - name: Set up patched Java
        shell: pwsh
        run: ./tools/SetupJava.ps1 -Platform linux-x86_64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: ${{ steps.versions.outputs.gradle }}

      - name: Build and test
        run: gradle build --warning-mode fail
