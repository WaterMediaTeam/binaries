name: Build Test

on:
  push:
    branches: ["main", "3.0.x"]
  pull_request:
    branches: ["main", "3.0.x"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # WATERMEDIA AND BINARIES ARE CODEPENDENT: REPRODUCE THE SUBMODULE LAYOUT (BINARIES INSIDE
    # WATERMEDIA) SO settings.gradle RESOLVES THE WATERMEDIA BUILD AT '..'
    defaults:
      run:
        working-directory: binaries

    steps:
      - name: Checkout watermedia repository
        uses: actions/checkout@v4
        with:
          repository: WaterMediaTeam/watermedia-v3

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: binaries
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Show Gradle & Java versions
        run: |
          gradle --version
          java -version

      - name: Build
        run: gradle build